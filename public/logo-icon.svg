<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F6EF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#844ff7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark hexagon background (flat-top orientation) -->
  <polygon
    points="100,10 177,55 177,145 100,190 23,145 23,55"
    fill="#0D0F1A"
    stroke="url(#grad)"
    stroke-width="4"
  />

  <!-- Arrow shaft -->
  <rect x="94" y="85" width="12" height="55" fill="url(#grad)" />

  <!-- Closed solid arrowhead -->
  <polygon points="100,38 122,85 78,85" fill="url(#grad)" />

  <!-- Left horizontal trace -->
  <rect x="44" y="118" width="50" height="8" fill="url(#grad)" />
  <!-- Left vertical down -->
  <rect x="44" y="118" width="8" height="28" fill="url(#grad)" />
  <!-- Left node -->
  <circle cx="48" cy="152" r="8" fill="url(#grad)" />

  <!-- Right horizontal trace -->
  <rect x="106" y="118" width="50" height="8" fill="url(#grad)" />
  <!-- Right vertical down -->
  <rect x="148" y="118" width="8" height="28" fill="url(#grad)" />
  <!-- Right node -->
  <circle cx="152" cy="152" r="8" fill="url(#grad)" />
</svg>
